name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. Pushing twice in quick succession, or a default-branch
# change, otherwise leaves two identical runs racing to publish the same
# image tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The pricing engine is the reason this exists. A green suite here is the only
# thing standing between a rate-card edit and a wrong number in front of a
# customer.
jobs:
  mobile:
    name: Flutter — analyse, test, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift's database.g.dart is generated, not committed. Without this step
      # the analyzer fails on a missing part file rather than on anything real.
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated localisations are current
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n; then
            echo "::error::lib/l10n is stale. Run 'flutter gen-l10n' and commit."
            git diff --stat -- lib/l10n
            exit 1
          fi

      - name: Every string exists in all three languages
        run: |
          missing=$(cat l10n-missing.txt 2>/dev/null | tr -d '[:space:]')
          if [ "$missing" != "{}" ] && [ -n "$missing" ]; then
            echo "::error::Untranslated strings. zh, en and ms must all be complete."
            cat l10n-missing.txt
            exit 1
          fi

      - name: Analyse
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test
        run: flutter test --coverage

      # The Dart suite writes sample quotations; this extracts their real text.
      # A grep over the PDF bytes proves nothing, because an embedded subset
      # font stores text as glyph indices — so only extraction can show that
      # the document says what hard rule 7 requires, and that the Chinese
      # actually rendered rather than coming out as tofu.
      - name: Check what the printed quotation actually says
        run: |
          pip install --quiet pypdf
          python3 ../tool/check_pdf_text.py

      # SPEC.md Phase 1 acceptance: 100% coverage on Length and Money. Asserted
      # rather than eyeballed, because a coverage number nobody checks is not a
      # criterion.
      - name: Enforce 100% coverage on the money and length types
        run: |
          python3 - <<'PY'
          import sys, collections
          files = collections.OrderedDict()
          cur = None
          for line in open('coverage/lcov.info', encoding='utf-8'):
              line = line.strip()
              if line.startswith('SF:'):
                  cur = line[3:].replace(chr(92), '/')
                  files[cur] = []
              elif line.startswith('DA:') and cur is not None:
                  no, hits = line[3:].split(',')
                  files[cur].append((int(no), int(hits)))

          required = ('core/length.dart', 'core/money.dart', 'core/rational.dart')
          failed = False
          for path, rows in files.items():
              if not path.endswith(required):
                  continue
              hit = sum(1 for _, h in rows if h > 0)
              total = len(rows)
              pct = 100.0 * hit / total if total else 100.0
              name = path.split('/lib/')[-1]
              status = 'ok' if pct == 100.0 else 'FAIL'
              print(f'{status:5} {name:<24} {pct:6.1f}%  {hit}/{total}')
              if pct == 100.0:
                  continue
              failed = True
              # Name the lines. A bare percentage sends whoever reads this
              # hunting through the file, and the answer can differ between
              # a developer machine and the runner.
              try:
                  src = open(path, encoding='utf-8').read().splitlines()
              except OSError:
                  src = []
              for no, hits in rows:
                  if hits == 0:
                      text = src[no - 1].strip() if no <= len(src) else '?'
                      print(f'      uncovered {name}:{no}  {text}')
          sys.exit(1 if failed else 0)
          PY

  backend:
    name: Python — the same fixtures, the same numbers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Production is Postgres. The JSONB column and the two partial indexes have
    # no equivalent on SQLite, so a suite that only ever ran in memory would
    # first meet them on the VPS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: milan
          POSTGRES_PASSWORD: milan
          POSTGRES_DB: milan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U milan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The whole point of the Phase 3 pricing work. If the two engines drift,
      # §9.4 has the server re-pricing every line the app sends and the customer
      # is told one number and invoiced another.
      - name: Test
        run: python -m pytest -q

      # The same schema tests again, against the real thing.
      - name: Schema, on Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://milan:milan@localhost:5432/milan_test
        run: python -m pytest tests/test_migrations.py -q

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

  deploy:
    name: The stack comes up, and the backup restores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts
        run: shellcheck deploy/*.sh

      - name: Compose file and Caddyfile are valid
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e MILAN_DOMAIN=ci.example.com -e MILAN_ACME_EMAIL=ci@example.com \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile

      # Caddy is left out: it would try to get a real certificate for a domain
      # that does not resolve. Everything below it runs for real.
      - name: Bring up the database and the API
        working-directory: deploy
        run: |
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          docker compose up -d --build db api
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' milan-api-1)" = healthy ]; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker compose logs
          echo "::error::the API never became healthy"; exit 1

      # Proves the container really did migrate on boot, not just start.
      # Compared against what alembic reports as head, never a literal
      # revision: `grep -q 0001` was still passing itself off as this check
      # after 0002 and 0003 landed, and a hardcoded revision goes stale on the
      # next migration while still looking like it is being verified.
      - name: The schema is at the migration head
        working-directory: deploy
        run: |
          set -a
          # shellcheck source=/dev/null
          . ./.env
          set +a

          head=$(docker compose exec -T api alembic heads \
            | awk '{print $1}' | grep -E '^[0-9a-z_]+$' | head -1)
          applied=$(docker compose exec -T db \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA \
            -c "SELECT version_num FROM alembic_version;" | tr -d '[:space:]')

          echo "head=$head applied=$applied"
          if [ -z "$head" ] || [ -z "$applied" ]; then
            echo "::error::could not read the migration head or the applied revision"
            exit 1
          fi
          if [ "$head" != "$applied" ]; then
            echo "::error::the database is at $applied but head is $head - the container did not migrate on boot"
            exit 1
          fi

      # The first-boot sequence from deploy/README.md, run exactly as written.
      # The PIN goes in on stdin, never as an argument: an argument lands in
      # shell history and in ps output.
      - name: Create the first admin and publish a card
        working-directory: deploy
        run: |
          echo '4821' | docker compose exec -T api \
            python -m app.cli users add --name "CI Admin" --phone 0123456789 --role admin
          docker compose cp ../shared/rate-card-fair-2026-08.json api:/tmp/card.json
          docker compose exec -T api \
            python -m app.cli cards publish /tmp/card.json --list-id fair

      # Over real HTTP, through the real container. Proves the parts fit
      # together, which no unit test can.
      - name: Sign in and pull the card over HTTP
        working-directory: deploy
        run: |
          docker compose exec -T api python - <<'PY'
          import json, urllib.request
          def call(path, body=None, token=None):
              req = urllib.request.Request(f"http://127.0.0.1:8000{path}")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              if body is not None:
                  req.add_header("Content-Type", "application/json")
                  req.data = json.dumps(body).encode()
              return json.load(urllib.request.urlopen(req))

          session = call("/api/auth/login", {
              "phone": "0123456789", "pin": "4821", "device_id": "ci-device",
          })
          assert session["user"]["role"] == "admin", session
          bundle = call("/api/bundle?list_id=fair", token=session["token"])
          assert bundle["rate_card_version"] == 1, bundle
          assert len(bundle["payload"]["rules"]) == 77, len(bundle["payload"]["rules"])
          print("signed in and pulled", len(bundle["payload"]["rules"]), "rules")
          PY

      - name: An unauthenticated pull is refused
        working-directory: deploy
        run: |
          docker compose exec -T api python - <<'PY'
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/bundle")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
              print("ok - 401 without a token")
          else:
              raise SystemExit("the bundle served a card to nobody")
          PY

      # The point of the whole job. A backup nobody has restored is a guess,
      # and this is the only machine in the loop that can prove otherwise.
      - name: Back up, and restore the backup
        working-directory: deploy
        env:
          MILAN_BACKUP_DIR: /tmp/milan-backups
        run: ./backup.sh

      - name: A backup of an empty database must fail the drill
        working-directory: deploy
        env:
          MILAN_BACKUP_DIR: /tmp/milan-backups-empty
        run: |
          set -a; . ./.env; set +a
          docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -q \
            -c "DELETE FROM rate_cards;"
          if ./backup.sh; then
            echo "::error::the restore drill passed on a database with no rate cards, so it proves nothing"
            exit 1
          fi
          echo "ok — the drill fails when it should"

      - name: Logs, if anything above failed
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v

  fixtures:
    name: Shared files are well formed and in step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          for f in shared/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

      - name: The bundled rate cards match shared/
        run: |
          diff -u shared/rate-card-fair-2026-08.json \
                  mobile/assets/data/rate-card-fair-2026-08.json
          diff -u shared/rate-card-standard.json \
                  mobile/assets/data/rate-card-standard.json

      # The standard list is derived, so it must be exactly what the generator
      # produces. A hand-edit here would be silently overwritten next time
      # anyone regenerates, taking the price change with it.
      - name: The standard list matches its derivation
        run: |
          cp shared/rate-card-standard.json /tmp/before.json
          python3 tool/build_standard_card.py
          diff -u /tmp/before.json shared/rate-card-standard.json \
            || { echo "::error::rate-card-standard.json is not what tool/build_standard_card.py produces. Edit the fair card or the generator, not the derived file."; exit 1; }

      - name: No printed document may claim to be a tax invoice
        # CLAUDE.md hard rule 7 is a legal constraint, not a labelling
        # preference. SQL Account is the sole issuer of record.
        #
        # Whole-line comments are dropped first: a comment is not printed, and
        # the rule is quoted verbatim in quote_pdf.dart where it applies. A
        # trailing comment still counts, which errs the safe way. This is the
        # cheap static half -- the half with teeth is the widget test that
        # renders the real PDF and reads the text back out of it.
        run: |
          found=0
          while IFS= read -r f; do
            case "$f" in
              *.dart) body=$(grep -vE '^[[:space:]]*(//|\*|/\*)' "$f") ;;
              *)      body=$(cat "$f") ;;
            esac
            hit=$(printf '%s\n' "$body" \
              | grep -niE '"(tax invoice|e-invoice)"|>[[:space:]]*(Tax Invoice|e-Invoice)') || true
            if [ -n "$hit" ]; then
              found=1
              printf '%s\n' "$hit" | while IFS= read -r line; do
                echo "$f: $line"
              done
            fi
          done < <(find mobile/lib -type f \( -name '*.dart' -o -name '*.arb' \))

          if [ "$found" = 1 ]; then
            echo "::error::A user-facing string claims to be a tax invoice."
            exit 1
          fi
          echo "ok — nothing printable claims to be a tax invoice"
