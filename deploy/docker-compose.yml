# One node, restorable in under an hour. CLAUDE.md: no Kubernetes, no
# microservices -- that is the right shape for one developer supporting one
# client, and it is also the shape a person can reason about at 2am.
#
#   cd deploy && cp .env.example .env && $EDITOR .env && docker compose up -d
#
# Every service below gets a memory/CPU ceiling and a log cap. Sized for a
# small box (2 vCPU / 4GB) -- tune both if the real one differs. Without
# these, a leak or a noisy log is how a $6 VPS goes down at 3am: OOM has no
# ceiling to stop at, and json-file has no cap by default, so either can fill
# the disk or take the whole box down long before anyone is watching.
name: milan

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Deterministic collation. Left to the host locale, a restore onto a
      # differently configured machine can fail on index rebuild.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Kuala_Lumpur
    volumes:
      - db-data:/var/lib/postgresql/data
    # No `ports:`. The database is reachable on the compose network and
    # nowhere else; publishing 5432 on a VPS is how these get found.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: Asia/Kuala_Lumpur
      # SPEC.md §14.7. Defaults to "none" (disabled) when unset in .env --
      # a fresh deploy stays exactly as it is today until someone chooses a
      # provider below and gives it a key. RECOGNITION_MODEL is passed
      # through to whichever one is chosen; each provider has its own
      # sensible default if left unset (app/services/recognition_providers.py).
      RECOGNITION_PROVIDER: ${RECOGNITION_PROVIDER:-none}
      RECOGNITION_MODEL: ${RECOGNITION_MODEL:-}
      # Only the chosen provider's key needs a real value in .env -- the
      # other two stay blank and their adapters answer `configured: false`,
      # same as the placeholder does today. `_BASE_URL` is how any of the
      # three points at a self-hosted, API-compatible model instead of the
      # real vendor endpoint.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    # Also unpublished: Caddy is the only way in, so TLS cannot be bypassed.
    expose:
      - "8000"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  caddy:
    # Built rather than pulled: the image is Caddy with the dashboard baked in.
    # A shared volume would let the files on disk and the image serving them be
    # different versions, and the way you would find that out is somebody
    # seeing a screen that no longer exists in the code.
    build:
      context: ../dashboard
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MILAN_DOMAIN: ${MILAN_DOMAIN}
      MILAN_ACME_EMAIL: ${MILAN_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live in a volume. Losing them means re-issuing, and Let's
      # Encrypt rate-limits that hard enough to matter during a fair.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  db-data:
  caddy-data:
  caddy-config:
