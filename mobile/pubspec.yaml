name: milan_quote
description: "Milan Software — quotation app. Phase 1: Quotation Proof."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State. CLAUDE.md pins Riverpod.
  flutter_riverpod: 2.6.1

  # Message formatting and locale-aware number/date output.
  intl: 0.20.2

  # Local database. CLAUDE.md pins Drift — relational, not key-value. A quote is
  # an order with lines, and Hive would turn every read into hand-rolled joins.
  drift: 2.28.2
  drift_flutter: 0.2.7
  path_provider: 2.1.5
  path: 1.9.1

  # Client-generated UUID v4. Two part-timers offline at one fair must never
  # collide, so ids are made on the device and never issued by the server.
  uuid: 4.5.1

  # On-device PDF. CLAUDE.md pins these, and §9 requires the quote to reach
  # WhatsApp with the phone in airplane mode — so nothing may be rendered
  # server-side.
  pdf: 3.11.3
  printing: 5.14.2
  share_plus: 13.3.0

  # Photo per window. §8.1 wants one tap from inside the line — no gallery
  # round-trip, no crop step.
  image_picker: 1.1.2

  # Picking the edited price list back off the device. Without it the admin has
  # to get a file into the app's private folder by hand, which is not a thing
  # anyone does.
  file_picker: 12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.28.2
  build_runner: 2.7.1

flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the ARB files.
  generate: true

  assets:
    - assets/data/
    - assets/fonts/

  # The SCREEN bundles no font: Android ships Noto Sans CJK system-wide, so
  # Chinese falls back correctly for zero bytes.
  #
  # The PDF cannot borrow it. A PDF carries its own glyphs, so the document
  # needs an embedded CJK face. The full family is ~9MB and would push the APK
  # past the <30MB target in SPEC.md §12, so assets/fonts/NotoSansSC-Subset.ttf
  # is Noto Sans SC instanced at Regular and subset to GB2312 levels 1 and 2
  # plus every character in the ARB files and the rate card — 7,272 characters
  # in 2.2MB.
  #
  # GB2312 rather than only our own strings, because a customer's name is free
  # text: a narrower subset would render an unusual name as tofu on the very
  # document they take away.
  #
  # SIL Open Font License; assets/fonts/OFL.txt ships alongside it.
