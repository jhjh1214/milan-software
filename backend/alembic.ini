# Alembic. The URL is deliberately not written here: it comes from
# DATABASE_URL, so the same image runs against Compose, a throwaway test
# container and the VPS without a config edit -- and so a password never lands
# in the repo.

[alembic]
script_location = migrations
prepend_sys_path = .
# UTC, matching the timestamptz convention. Filenames sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
